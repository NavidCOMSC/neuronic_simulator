name: openmc-pincell
channels:
  - conda-forge
dependencies:
  - python=3.12 # OpenMC 0.16 requires >=3.12
  - openmc=0.16.0 # pin for reproducibility (non-MPI build is fine for a pin cell)
  - numpy
  - pandas
  - scipy
  - matplotlib
  - h5py
  - uncertainties
  - lxml
  - jupyterlab
  - ipykernel
  - pip
  - pip:
      - openmc_data # optional: download_endf helper (third-party, pin a version)
